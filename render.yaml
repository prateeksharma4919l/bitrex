services:
  - type: web
    name: bitrex
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /demo
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_MODE
        value: DEMO
      - key: DATABASE_URL
        fromDatabase:
          name: bitrex-db
          property: connectionString
      - key: APP_URL
        fromService:
          name: bitrex
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: bitrex-db
    databaseName: bitrex
    user: bitrex
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
